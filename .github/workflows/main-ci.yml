name: Main CI (Trigger & Orchestrator)

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  android-ci-matrix:
    strategy:
      matrix:
        api-level: [24, 33, 35]

    uses: ./.github/workflows/reusable-android-build.yml
    with:
      api-level: ${{ matrix.api-level }}
    secrets:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      MY_KEYSTORE_PASSWORD: ${{ secrets.MY_KEYSTORE_PASSWORD }}