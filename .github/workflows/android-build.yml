name: First Android Workflow

# Configure trigger: Workflow will trigger when push or PR to master branch
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code from GitHub Repo to server CI
      - name: Checkout Source Code
        uses: TruongThanhIT/GitHubRepoExplorer@v1.0.0

      # 2. Config env JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Config Gradle and auto Cache (follow docs.gradle.org)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          # Help cache dependencies downloaded for next build faster
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      # 4. Grant permission for Gradle Wrapper
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 5. Run build
      - name: Run build
        run: ./gradlew build