name: Reusable Android Build Template

on:
  workflow_call:
    inputs:
      api-level:
        required: true
        type: number
    secrets:
      KEYSTORE_BASE64:
        required: true
      MY_KEYSTORE_PASSWORD:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Publish Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report-api-${{ inputs.api-level }}
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Run Android Lint
        run: ./gradlew lintDebug

      - name: Publish Lint Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report-api-${{ inputs.api-level }}
          path: app/build/reports/lint-results-debug.*

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo $KEYSTORE_BASE64 | base64 --decode > app/release.keystore

      - name: Build with Keystore
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.MY_KEYSTORE_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-api-${{ inputs.api-level }}
          path: app/build/outputs/apk/release/*.apk