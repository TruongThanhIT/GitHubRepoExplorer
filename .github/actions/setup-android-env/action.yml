name: 'Setup Android Environment'
description: 'Group steps setup Checkout, Java, Ruby, Fastlane Cache and Gradle'

runs:
  using: 'composite'
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/master' }}

    - name: Make gradlew executable
      shell: bash # must have in composite action
      run: chmod +x ./gradlew